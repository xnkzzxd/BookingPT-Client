name: Tarik portal dari XNK

# Portal klien statis dibangun di repo XNK (Phase AAA) dan diterbitkan di xnk.my.id/client/ dengan manifest berisi sha256.
# Action ini menariknya ke akar situs (halaman lama tersimpan di legacy.html) dan commit kalau berubah. Data publik saja, tanpa secret.
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: pull-xnk

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/pull-xnk.js client .
      - name: Commit kalau berubah
        run: |
          git config user.name "xnk-bot"
          git config user.email "xnk-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Tidak ada perubahan."; else git commit -m "Tarik portal dari xnk.my.id" && git pull --rebase origin main && git push; fi
